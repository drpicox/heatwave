<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nits de calor a Catalunya</title>
<meta name="description" content="Quants dies l'any superen un llindar de temperatura a cada estació de la XEMA, i com ha canviat.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="lede">
      <p class="eyebrow" id="x-eyebrow"></p>
      <h1 id="x-h1"></h1>
      <p id="x-lede"></p>
    </div>
    <div class="masthead-side">
      <div class="seg langs" role="group" id="lang-group" aria-label="Idioma"></div>
      <div class="plate" id="plate"></div>
    </div>
  </header>

  <section class="controls">
    <div class="control-row">
      <div class="field">
        <span class="lbl" id="x-l-view"></span>
        <div class="seg" role="group" id="view-group" aria-labelledby="x-l-view"></div>
      </div>
      <div class="field">
        <label for="f-station" id="x-l-station"></label>
        <select id="f-station"></select>
      </div>
      <div class="field">
        <label for="f-var" id="x-l-var"></label>
        <select id="f-var"></select>
      </div>
      <div class="field">
        <span class="lbl" id="x-l-op"></span>
        <div class="seg" role="group" aria-labelledby="x-l-op">
          <button type="button" id="op-ge" aria-pressed="true"></button>
          <button type="button" id="op-le" aria-pressed="false"></button>
        </div>
      </div>
      <div class="field">
        <div class="thr-head">
          <label for="f-thr" id="x-l-thr"></label>
          <span class="thr-val" id="thr-val"></span>
        </div>
        <div class="hist-box">
          <svg id="hist" aria-hidden="true"></svg>
          <input type="range" id="f-thr" min="-10" max="45" step="0.5" value="20"
                 aria-describedby="thr-help">
        </div>
        <span id="thr-help" class="hint"></span>
      </div>
      <div class="field">
        <label for="f-season" id="x-l-season"></label>
        <select id="f-season"></select>
      </div>
    </div>

    <div class="control-row two">
      <div class="field">
        <div class="thr-head">
          <span class="lbl" id="x-l-years"></span>
          <span class="thr-val" id="yr-val"></span>
        </div>
        <div class="dual" id="yr-dual">
          <div class="dual-track"></div>
          <div class="dual-fill" id="yr-fill"></div>
          <input type="range" id="yr-a" step="1" aria-label="Any inicial">
          <input type="range" id="yr-b" step="1" aria-label="Any final">
        </div>
        <span class="hint" id="x-h-years"></span>
      </div>
      <div class="field">
        <div class="thr-head">
          <span class="lbl" id="x-l-split"></span>
          <span class="thr-val" id="split-val"></span>
        </div>
        <input type="range" id="f-split" step="1" aria-label="Punt de tall">
        <span class="hint" id="x-h-split"></span>
      </div>
    </div>

    <div class="presets">
      <span class="lbl" id="x-l-presets"></span>
      <div id="preset-list" style="display:contents"></div>
    </div>
  </section>

  <section class="panel nomes-mapa" id="panel-mapa">
    <div class="panel-head">
      <div><h2 id="t-mapa"></h2><p class="sub" id="s-mapa"></p></div>
      <div class="scale-legend" id="l-mapa"></div>
    </div>
    <div class="chart" id="c-mapa"><svg></svg><div class="tip"></div></div>
  </section>

  <section class="readout nomes-estacio" aria-live="polite">
    <div>
      <div class="hero-fig" id="hero-fig"></div>
      <div class="hero-cap" id="hero-cap"></div>
      <div class="hero-delta" id="hero-delta"></div>
    </div>
    <p class="sentence" id="sentence"></p>
  </section>

  <section class="tiles nomes-estacio" id="tiles"></section>

  <section class="panel nomes-estacio">
    <div class="panel-head">
      <div><h2 id="t-count"></h2><p class="sub" id="s-count"></p></div>
      <div class="legend" id="l-count"></div>
    </div>
    <div class="chart" id="c-count"><svg></svg><div class="tip"></div></div>
  </section>

  <section class="panel nomes-estacio">
    <div class="panel-head">
      <div><h2 id="t-mean"></h2><p class="sub" id="s-mean"></p></div>
      <div class="legend" id="l-mean"></div>
    </div>
    <div class="chart" id="c-mean"><svg></svg><div class="tip"></div></div>
  </section>

  <section class="panel nomes-estacio">
    <div class="panel-head">
      <div><h2 id="t-heat"></h2><p class="sub" id="s-heat"></p></div>
      <div class="scale-legend" id="l-heat"></div>
    </div>
    <div class="chart" id="c-heat"><svg></svg><div class="tip"></div></div>
  </section>

  <details class="tableview nomes-estacio">
    <summary id="x-table-summary"></summary>
    <div class="table-body"><div class="tscroll"><table id="tabla">
      <thead><tr id="t-head"></tr></thead><tbody></tbody>
    </table></div></div>
  </details>

  <footer id="x-footer"></footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
